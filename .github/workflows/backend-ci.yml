# ==============================================================================
# Poltekkes CAT Backend — CI/CD Pipeline (Golang)
# ==============================================================================
# Repository: rakayl/cbt-be-poltekkes
# Flow:
#   push staging  → Lint → Build & Test → Migration Check → Deploy ke VPS Staging
#   push main     → Lint → Build & Test → Migration Check → Deploy ke VPS Production
#   PR            → Lint → Build & Test → Migration Check (tanpa deploy)
#   manual        → Lint → Build & Test → Deploy ke target pilihan
#
# Deployment Strategy:
#   1. CI mengompilasi binary Go untuk linux/amd64 (CGO_ENABLED=0)
#      *Note: Migrasi SQL otomatis di-embed ke binary via go:embed*
#   2. SCP binary ke VPS
#   3. Docker Compose di VPS me-restart container dengan .env yang sudah ada di server
# ==============================================================================

name: "Backend CI/CD"

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target environment"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

# ──────────────────────────────────────────────────────────────────────────────
# Concurrency: cancel in-flight runs for the same branch / PR
# ──────────────────────────────────────────────────────────────────────────────
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Environment variables shared across all jobs
# ──────────────────────────────────────────────────────────────────────────────
env:
  GO_VERSION: "1.24"
  BINARY_NAME: "poltekkes-cat-api"

jobs:
  # ============================================================================
  # Job 1 — Lint & Static Analysis
  # ============================================================================
  lint:
    name: "🔍 Lint & Vet"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files are not properly formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
          echo "✅ All Go files are properly formatted."

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ============================================================================
  # Job 2 — Build & Test
  # ============================================================================
  build:
    name: "🏗️ Build & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      # ── Run tests (if available) ───────────────────────────────────────────
      - name: Run tests
        run: |
          TEST_OUTPUT=$(go test ./... -v -count=1 -timeout=300s 2>&1) || true
          echo "$TEST_OUTPUT"
          if echo "$TEST_OUTPUT" | grep -q "no test files"; then
            echo "⚠️ No test files found — skipping test phase."
          fi

      # ── Build Linux binary (production target) ────────────────────────────
      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ env.BINARY_NAME }} \
            ./cmd/api/

          echo "✅ Binary compiled successfully"
          ls -lh ${{ env.BINARY_NAME }}
          file ${{ env.BINARY_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-${{ github.sha }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 7
          if-no-files-found: error

      # ── Build summary ──────────────────────────────────────────────────────
      - name: Build summary
        run: |
          BINARY_SIZE=$(du -h ${{ env.BINARY_NAME }} | awk '{print $1}')
          echo "## 📦 Backend Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary** | \`${{ env.BINARY_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | ${BINARY_SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| **OS/Arch** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Version** | ${{ env.GO_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 3 — Database Migration Check (dry-run)
  # ============================================================================
  migration-check:
    name: "🗄️ Migration Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SQL migration files
        run: |
          MIGRATION_DIR="internal/shared/database/migrations"
          echo "## 🗄️ Migration Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -d "$MIGRATION_DIR" ]; then
            echo "⚠️ No migration directory found at $MIGRATION_DIR" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "| # | File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|------|------|" >> $GITHUB_STEP_SUMMARY

          count=0
          for f in $(ls "$MIGRATION_DIR"/*.sql 2>/dev/null | sort); do
            count=$((count + 1))
            fname=$(basename "$f")
            fsize=$(du -h "$f" | awk '{print $1}')
            echo "| $count | \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
          done

          if [ "$count" -eq 0 ]; then
            echo "| - | No migration files found | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **$count** migration file(s) detected and embedded into binary." >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Job 4 — Deploy to Staging VPS
  # ============================================================================
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, migration-check]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'staging')

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary-${{ github.sha }}
          path: ./

      - name: Make binary executable
        run: chmod +x ./${{ env.BINARY_NAME }}

      # ── Copy binary to VPS via SCP ─────────────────────────────────────────
      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          source: "${{ env.BINARY_NAME }}"
          target: "/tmp/poltekkes-deploy/"

      # ── Deploy on VPS via SSH ──────────────────────────────────────────────
      - name: Deploy on Staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ vars.STAGING_BACKEND_PATH || '/var/www/staging/cbt-be-poltekkes' }}"
            BACKUP_DIR="${DEPLOY_DIR}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "============================================"
            echo "🚀 Deploying Poltekkes CAT Backend (Staging)"
            echo "   Commit: ${{ github.sha }}"
            echo "   Time:   $(date)"
            echo "============================================"

            # 1. Pastikan direktori deploy ada
            mkdir -p "${DEPLOY_DIR}"
            mkdir -p "${BACKUP_DIR}"

            # 2. Backup binary yang sedang berjalan
            if [ -f "${DEPLOY_DIR}/${{ env.BINARY_NAME }}" ]; then
              cp "${DEPLOY_DIR}/${{ env.BINARY_NAME }}" \
                 "${BACKUP_DIR}/${{ env.BINARY_NAME }}.${TIMESTAMP}.bak"
              echo "✅ Backup created: ${{ env.BINARY_NAME }}.${TIMESTAMP}.bak"

              # Simpan hanya 5 backup terakhir
              ls -t "${BACKUP_DIR}"/${{ env.BINARY_NAME }}.*.bak 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            fi

            # 3. Cari dan pindahkan binary baru
            NEW_BIN=$(find /tmp/poltekkes-deploy -name "${{ env.BINARY_NAME }}" -type f 2>/dev/null | head -1)
            if [ -z "$NEW_BIN" ]; then
              echo "❌ ERROR: Binary ${{ env.BINARY_NAME }} tidak ditemukan di /tmp/poltekkes-deploy"
              ls -laR /tmp/poltekkes-deploy/ || true
              exit 1
            fi
            echo "✅ Ditemukan binary di: $NEW_BIN"
            cp "$NEW_BIN" "${DEPLOY_DIR}/${{ env.BINARY_NAME }}"
            chmod +x "${DEPLOY_DIR}/${{ env.BINARY_NAME }}"
            echo "✅ Binary updated"

            # 4. Verifikasi file .env di server
            if [ ! -f "${DEPLOY_DIR}/.env" ]; then
              echo "❌ FATAL: .env file not found at ${DEPLOY_DIR}/.env"
              echo "   The .env must be configured manually on the server."
              echo "   Aborting deployment."
              exit 1
            fi
            echo "✅ .env file found on server (using server-side config)"

            # 5. Rebuild & restart container
            cd "${DEPLOY_DIR}"
            echo "🔄 Rebuilding Docker container..."
            docker compose down --timeout 30 || true
            docker compose build --no-cache
            docker compose up -d

            # 6. Tunggu & verifikasi status container
            echo "⏳ Waiting for container to start (10s)..."
            sleep 10

            CONTAINER_NAME=$(docker compose ps -q 2>/dev/null | head -1)
            if [ -n "$CONTAINER_NAME" ]; then
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "no-healthcheck")
              RUNNING=$(docker inspect --format='{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo "false")

              if [ "$RUNNING" = "true" ]; then
                echo "✅ Container is running! (health: ${HEALTH})"
              else
                echo "❌ Container is NOT running!"
                echo "📋 Logs:"
                docker compose logs --tail 50
                exit 1
              fi
            else
              echo "❌ No container found!"
              exit 1
            fi

            # 7. Bersihkan file temp
            rm -rf /tmp/poltekkes-deploy/
            echo ""
            echo "============================================"
            echo "✅ Staging deployment complete!"
            echo "============================================"

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | \`${{ secrets.STAGING_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary** | \`${{ env.BINARY_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **.env** | Server-side (NOT from repo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 5 — Deploy to Production VPS
  # ============================================================================
  deploy-production:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, migration-check]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production')

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary-${{ github.sha }}
          path: ./

      - name: Make binary executable
        run: chmod +x ./${{ env.BINARY_NAME }}

      # ── Copy binary to VPS via SCP ─────────────────────────────────────────
      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          source: "${{ env.BINARY_NAME }}"
          target: "/tmp/poltekkes-deploy/"

      # ── Deploy on VPS via SSH ──────────────────────────────────────────────
      - name: Deploy on Production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ vars.PRODUCTION_BACKEND_PATH || '/var/www/production/cbt-be-poltekkes' }}"
            BACKUP_DIR="${DEPLOY_DIR}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "============================================"
            echo "🚀 Deploying Poltekkes CAT Backend (Production)"
            echo "   Commit: ${{ github.sha }}"
            echo "   Time:   $(date)"
            echo "============================================"

            # 1. Pastikan folder deploy & backup ada
            mkdir -p "${DEPLOY_DIR}"
            mkdir -p "${BACKUP_DIR}"

            # 2. Backup binary lama
            if [ -f "${DEPLOY_DIR}/${{ env.BINARY_NAME }}" ]; then
              cp "${DEPLOY_DIR}/${{ env.BINARY_NAME }}" \
                 "${BACKUP_DIR}/${{ env.BINARY_NAME }}.${TIMESTAMP}.bak"
              echo "✅ Backup created"
              ls -t "${BACKUP_DIR}"/${{ env.BINARY_NAME }}.*.bak 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            fi

            # 3. Cari dan pindahkan binary baru
            NEW_BIN=$(find /tmp/poltekkes-deploy -name "${{ env.BINARY_NAME }}" -type f 2>/dev/null | head -1)
            if [ -z "$NEW_BIN" ]; then
              echo "❌ ERROR: Binary ${{ env.BINARY_NAME }} tidak ditemukan di /tmp/poltekkes-deploy"
              ls -laR /tmp/poltekkes-deploy/ || true
              exit 1
            fi
            echo "✅ Ditemukan binary di: $NEW_BIN"
            cp "$NEW_BIN" "${DEPLOY_DIR}/${{ env.BINARY_NAME }}"
            chmod +x "${DEPLOY_DIR}/${{ env.BINARY_NAME }}"
            echo "✅ Binary updated"

            # 4. Verifikasi .env server
            if [ ! -f "${DEPLOY_DIR}/.env" ]; then
              echo "❌ FATAL: .env file not found at ${DEPLOY_DIR}/.env"
              exit 1
            fi
            echo "✅ .env file found on server"

            # 5. Rebuild & restart
            cd "${DEPLOY_DIR}"
            docker compose down --timeout 30 || true
            docker compose build --no-cache
            docker compose up -d

            # 6. Healthcheck
            echo "⏳ Waiting for container to start (10s)..."
            sleep 10
            CONTAINER_NAME=$(docker compose ps -q 2>/dev/null | head -1)
            if [ -n "$CONTAINER_NAME" ]; then
              RUNNING=$(docker inspect --format='{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo "false")
              if [ "$RUNNING" = "true" ]; then
                echo "✅ Container is running!"
              else
                echo "❌ Container is NOT running!"
                docker compose logs --tail 50
                exit 1
              fi
            fi

            rm -rf /tmp/poltekkes-deploy/
            echo "✅ Production deployment complete!"

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary** | \`${{ env.BINARY_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **.env** | Server-side (NOT from repo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
